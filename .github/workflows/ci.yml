name: CI

# Linux and Windows both build and run the unit/integration suite. Opener argv
# is tested as pure platform-specific command specs, so Windows quoting stays
# covered without launching GUI applications in CI. Linux additionally drives
# its preinstalled Chrome through a real half-second Revideo render.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A fork's pull request runs `pnpm install` (root postinstall) and `pnpm build`
# on these runners, which is arbitrary code execution by definition. Nothing in
# this workflow needs to write anything back, so it gets no write.
permissions:
  contents: read

# Three pushes in a minute should not run the Windows leg and a real render
# three times. Pushes to main are never cancelled — every commit on main earns
# its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The workspace retains upstream @revideo/renderer only as a build input for
  # our puppeteer-core bridge. Published consumers never install this copy.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  DISABLE_TELEMETRY: "true"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a Windows failure must not hide the Linux result
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag is mutable, and
      # these run against untrusted pull requests. Dependabot keeps them current
      # (see .github/dependabot.yml) — bump the SHA, not the trailing comment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6 — pnpm version comes from packageManager in package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Verify FFmpeg tools
        run: |
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # also produces the editor dist the edit-server tests serve
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm test:package
      - name: Render smoke
        if: runner.os == 'Linux'
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          OPEN_TAKE_E2E_CHROME="$chrome_path" pnpm --filter @open-take/compositor test:render-smoke
