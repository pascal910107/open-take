# One pnpm workspace, one lockfile at the root — Dependabot resolves the
# workspace packages from there, so a single npm entry covers packages/* and
# apps/*.
#
# Monthly, and grouped: this repo ships a browser-and-ffmpeg dependency tree,
# and a weekly ungrouped schedule would produce more PRs than a solo maintainer
# can watch renders for.
#
# npm majors stay ungrouped — a @revideo or puppeteer major wants its own render
# smoke run. Action majors do NOT: an action's blast radius stops at the runner,
# and CI either passes on it or does not, so they ride in the group.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        # Excluded packages get their own pull request even for a patch. Two
        # reasons, and both were earned:
        #
        # tsdown and turbo are the build. tsdown is 0.x, where a "minor" is a
        # major with the paperwork skipped — dependabot read 0.9.0 -> 0.22.14 as
        # a minor, one broken config loader took the build down, and seven
        # blameless updates were stuck behind it. Build tooling rides alone.
        #
        # The render stack is the part CI cannot vouch for. The smoke test
        # points OPEN_TAKE_E2E_CHROME at a preinstalled Chrome, so the download
        # and cache paths never run in CI, and a render can get worse without
        # any test going red. These want a human watching the output.
        exclude-patterns:
          - "tsdown"
          - "turbo"
          - "@revideo/*"
          - "puppeteer-core"
          - "@puppeteer/browsers"

  # The workflows pin actions by commit SHA (see .github/workflows/*.yml), which
  # is only safe if something keeps them current. This is that something.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
