<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Take — original motion fixtures</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#25251f;font-family:"Avenir Next",Avenir,sans-serif}button{font:inherit;cursor:pointer}main{padding:42px 64px;min-height:900px}header{display:flex;align-items:center;justify-content:space-between;padding-bottom:28px;border-bottom:1px solid #25251f33}.brand{font-size:28px;letter-spacing:-1px;font-weight:700}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase}h1{font:normal 62px/1.04 Georgia,serif;letter-spacing:-2px;margin:42px 0 18px}p{color:#706f64;line-height:1.6}button{border:1px solid #25251f;border-radius:30px;background:transparent;padding:10px 22px}button[aria-pressed=true]{background:#25251f;color:white}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.intro p{max-width:410px}.products{display:grid;grid-template-columns:1fr 1fr;gap:28px}.product{background:#e8dfcf;border:1px solid #c9c0b0;padding:24px;border-radius:2px}.product:nth-child(2){background:#dfded5}.art{height:270px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#43372024,transparent 65%)}.lamp{position:absolute;inset:15px 0 0}.shade{position:absolute;left:50%;transform:translateX(-50%);top:30px;width:180px;height:95px;border-radius:95px 95px 12px 12px;background:linear-gradient(100deg,#a76135,#d79359 60%,#bb7741)}.stand{position:absolute;top:105px;left:calc(50% - 8px);width:16px;height:120px;background:linear-gradient(90deg,#544733,#9b8b63)}.base{position:absolute;left:calc(50% - 65px);top:215px;width:130px;height:16px;border-radius:50%;background:#76674a}.arch .shade{width:115px;height:115px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff9d6,#dbc797)}.arch .stand{width:7px;top:130px;height:92px;background:#454946}.arch .base{width:100px;left:calc(50% - 50px);background:#454946}.product h2{font:normal 32px Georgia,serif;margin:10px 0}.product .row{display:flex;justify-content:space-between;align-items:center}.product p{margin:8px 0;font-size:15px}.tag{font-size:11px;letter-spacing:2px}.comparison{margin-top:22px;padding:20px 0;border-top:1px solid #b8af9f;display:flex;gap:60px;min-height:72px}.comparison[hidden]{display:none}.note{font-size:11px;letter-spacing:1px;opacity:.65;margin-top:24px}
.analytics{background:#101925;color:#e9edf1}.analytics header{border-color:#ffffff24}.analytics h1{font:500 54px/1.1 "Avenir Next",sans-serif;letter-spacing:-2px}.analytics p{color:#9faab6}.analytics button{border-color:#59616b;color:#bdc7d1}.analytics button[aria-pressed=true]{background:#dfff82;color:#101925;border-color:#dfff82}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}.metric{border-top:1px solid #445160;padding-top:22px}.metric strong{display:block;font-size:56px;letter-spacing:-2px;margin:14px 0}.positive{color:#dfff82}.chart{margin-top:35px;padding:30px;background:#182433;border-radius:10px;display:flex;align-items:flex-end;gap:22px;height:300px}.bar{flex:1;background:#a9c76d;border-radius:4px 4px 0 0;position:relative}.bar:last-child{background:#dfff82}.bar span{position:absolute;bottom:10px;width:100%;text-align:center;color:#101925;font-size:12px;font-weight:600}.chart-caption{display:flex;justify-content:space-between;font-size:13px;color:#8f9da9;margin-top:14px}
.board{background:#f3f1eb;color:#292c30}.board header{border-color:#c7c5bd}.board .brand{font-family:Georgia,serif;font-weight:400;font-style:italic;font-size:34px}.board h1{font:500 58px "Avenir Next",sans-serif}.board button{background:#c34632;border:0;color:white}.columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}.column{background:#e5e4de;min-height:470px;padding:20px}.column h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:0 0 26px}.task{background:#fffdf7;padding:22px;border-top:4px solid #c34632;box-shadow:0 4px 14px #2e302808;margin-bottom:18px}.task h3{font:normal 24px/1.3 Georgia,serif;margin:15px 0 25px}.task .row{display:flex;align-items:center;justify-content:space-between;font-size:12px}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#d6dfd8;color:#3a5b4b;font-size:11px}.task .category{font-size:10px;letter-spacing:2px;color:#aa493d}.task.small{border-color:#71817e}.task.small h3{font-size:20px;margin-bottom:20px}.empty{font-size:13px;color:#888c83;text-align:center;padding:50px 0;border:1px dashed #b5b8af}
</style>
<div id="app"></div>
<script>
const mode=new URLSearchParams(location.search).get('view')||'commerce';
const app=document.querySelector('#app');
if(mode==='commerce'){
document.title='Morrow — compare the collection';
app.innerHTML=`<main><header><span class="brand">morrow.</span><span class="eyebrow">Objects for everyday light</span><button id="compare" aria-pressed="false">Compare collection</button></header><div class="intro"><div><div class="eyebrow">Collection No. 04</div><h1>A little warmth.<br>A different shape.</h1></div><p>Two considered silhouettes.<br>Find the light that belongs in your space.</p></div><div class="products"><article class="product" data-crop="terra"><span class="tag">01 / THE READING LIGHT</span><div class="art"><div class="lamp"><div class="stand"></div><div class="base"></div><div class="shade"></div></div></div><div class="row"><h2>Terra</h2><span>$148</span></div><p>Warm clay · Focused light · 38 cm</p></article><article class="product" data-crop="orb"><span class="tag">02 / THE EVENING LIGHT</span><div class="art"><div class="lamp arch"><div class="stand"></div><div class="base"></div><div class="shade"></div></div></div><div class="row"><h2>Orb</h2><span>$172</span></div><p>Soft ivory · Ambient light · 34 cm</p></article></div><div class="comparison" hidden><span>Terra / Focused reading</span><span>Orb / Soft ambient glow</span><span>Both / Dimmable, replaceable LED</span></div><div class="note">OPEN TAKE ORIGINAL FIXTURE · ILLUSTRATIVE PRODUCTS</div></main>`;
document.querySelector('#compare').onclick=(e)=>{const active=e.target.getAttribute('aria-pressed')==='true';e.target.setAttribute('aria-pressed',String(!active));document.querySelector('.comparison').hidden=active};
}else if(mode==='analytics'){
document.title='Northline — studio metrics';
app.innerHTML=`<main class="analytics"><header><span class="brand">northline /</span><span class="eyebrow">Studio metrics</span><div><button id="week" aria-pressed="false">7 days</button> <button id="month" aria-pressed="true">30 days</button></div></header><div class="intro"><div><div class="eyebrow">Overview / September</div><h1>Know what is working.</h1></div><p>Your studio, in perspective.<br>One clear view of the month.</p></div><div class="metrics"><div class="metric" data-crop="revenue"><span>Revenue</span><strong id="revenue">$28,400</strong><span class="positive" id="growth">+24% from previous period</span></div><div class="metric"><span>Paid orders</span><strong id="orders">186</strong><span>Across 12 projects</span></div><div class="metric"><span>Repeat customers</span><strong>42%</strong><span class="positive">+8 percentage points</span></div></div><div class="chart" data-crop="chart"></div><div class="chart-caption"><span>Revenue / weekly distribution</span><span>USD · Illustrative dataset</span></div><div class="note">OPEN TAKE ORIGINAL FIXTURE · SAMPLE DATA</div></main>`;
const update = (week) => {document.querySelector('#week').setAttribute('aria-pressed',String(week));document.querySelector('#month').setAttribute('aria-pressed',String(!week));document.querySelector('#revenue').textContent=week?'$8,200':'$28,400';document.querySelector('#orders').textContent=week?'54':'186';document.querySelector('#growth').textContent=week?'+18% from previous period':'+24% from previous period';const values=week?[22,37,33,45,52,62,74]:[25,33,29,49,42,58,61,71,68,85,96,110];document.querySelector('.chart').innerHTML=values.map((v,i)=>'<div class="bar" style="height:'+v*1.9+'px"><span>'+String(i+1).padStart(2,'0')+'</span></div>').join('')};update(false);document.querySelector('#week').onclick=()=>update(true);document.querySelector('#month').onclick=()=>update(false);
}else{
document.title='Outline — release workspace';
app.innerHTML=`<main class="board"><header><span class="brand">Outline</span><span class="eyebrow">Team space / product</span><button id="advance">Move release forward →</button></header><div class="intro"><div><div class="eyebrow">Field guide / 2026</div><h1>Make the next step clear.</h1></div><p>Small tasks. Shared context.<br>A release that keeps moving.</p></div><div class="columns"><section class="column"><h2>01 / In progress</h2><article class="task" id="release" data-crop="release"><span class="category">RELEASE / PRIORITY</span><h3>Publish the autumn<br>field guide</h3><div class="row"><span>4 of 4 checks complete</span><span class="avatar">AL</span></div></article><article class="task small" data-crop="notes"><span class="category">WRITING</span><h3>Collect customer notes</h3><div class="row"><span>Tomorrow</span><span class="avatar">JT</span></div></article></section><section class="column" id="review"><h2>02 / Review</h2><article class="task small" data-crop="design"><span class="category">DESIGN</span><h3>Update the welcome page</h3><div class="row"><span>Ready for feedback</span><span class="avatar">MK</span></div></article></section><section class="column" id="shipped"><h2>03 / Shipped</h2><div class="empty">Good work goes here.</div></section></div><div class="note">OPEN TAKE ORIGINAL FIXTURE · DEMONSTRATION WORKSPACE</div></main>`;
let step=0;document.querySelector('#advance').onclick=(e)=>{if(step===0){document.querySelector('#review').append(document.querySelector('#release'));step++;e.target.textContent='Ship the field guide →'}else{document.querySelector('#shipped .empty')?.remove();document.querySelector('#shipped').append(document.querySelector('#release'));e.target.textContent='Field guide shipped ✓';e.target.disabled=true}};
}
</script>
</html>
